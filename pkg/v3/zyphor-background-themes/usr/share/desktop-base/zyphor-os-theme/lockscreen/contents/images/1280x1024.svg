<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="80%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Cyan & Electric Blue Gradients -->
    <linearGradient id="cyan-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="40%" stop-color="#22d3ee" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="cyan-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glass-shard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.02" />
    </linearGradient>

    <!-- Patterns -->
    <pattern id="dot-matrix" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#06b6d4" opacity="0.2" />
    </pattern>

    <pattern id="iso-grid" width="60" height="103.923" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 17.32 L 60 51.96 L 30 69.28 L 0 51.96 L 0 17.32 Z M 0 51.96 L 30 69.28 L 30 103.92 L 0 86.6 Z M 60 51.96 L 30 69.28 L 30 103.92 L 60 86.6 Z" 
            fill="none" stroke="#0ea5e9" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>

    <!-- Filters -->
    <filter id="cyan-glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="25" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="100" />
    </filter>
  </defs>

  <!-- Dark Tech Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />

  <!-- Background Ambient Glow Spots -->
  <circle cx="1500" cy="200" r="400" fill="#0284c7" opacity="0.2" filter="url(#ambient-blur)" />
  <circle cx="300" cy="800" r="500" fill="#0891b2" opacity="0.15" filter="url(#ambient-blur)" />

  <!-- Micro Dot Matrix & Isometric Grid Overlays -->
  <rect width="100%" height="100%" fill="url(#dot-matrix)" />
  <rect width="100%" height="100%" fill="url(#iso-grid)" />

  <!-- Abstract Angular Cyber Panels / Glass Shards -->
  <g opacity="0.7">
    <polygon points="1200,-100 1650,-100 1350,500 900,500" fill="url(#glass-shard)" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    <polygon points="1000,350 1500,350 1200,850 700,850" fill="url(#glass-shard)" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1" />
    <polygon points="400,600 950,600 700,1050 150,1050" fill="url(#glass-shard)" stroke="#22d3ee" stroke-opacity="0.1" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Data Beams -->
  <g filter="url(#cyan-glow-filter)">
    <path d="M -100 300 L 700 300 L 950 550 L 2050 550" fill="none" stroke="url(#cyan-beam)" stroke-width="3" />
    <path d="M -100 350 L 680 350 L 930 600 L 2050 600" fill="none" stroke="url(#cyan-beam)" stroke-width="1" opacity="0.6" />
    <path d="M -100 820 L 450 820 L 750 520 L 2050 520" fill="none" stroke="url(#cyan-beam)" stroke-width="2" />
    <path d="M -100 150 L 1100 150 L 1350 400 L 2050 400" fill="none" stroke="url(#cyan-beam)" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Glowing Circuit Nodes along the lines -->
  <g fill="#22d3ee" filter="url(#cyan-glow-filter)">
    <circle cx="700" cy="300" r="4" />
    <circle cx="950" cy="550" r="5" fill="#ffffff" />
    <circle cx="450" cy="820" r="4" />
    <circle cx="750" cy="520" r="5" fill="#ffffff" />
    <circle cx="1100" cy="150" r="4" />
    <circle cx="1350" cy="400" r="4" />
  </g>

  <!-- Floating Sci-Fi HUD Constructs & Focal Geometry -->
  <g transform="translate(1350, 400)">
    <!-- Concentric Tech Rings -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#0891b2" stroke-width="1" stroke-dasharray="6 10" opacity="0.5" />
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#cyan-primary)" stroke-width="2" stroke-dasharray="120 30 30 30" opacity="0.8" filter="url(#cyan-glow-filter)" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#0284c7" stroke-width="1.5" />
    
    <!-- Central Bright Node -->
    <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#cyan-glow-filter)" />

    <!-- Crosshair Ticks -->
    <line x1="-190" y1="0" x2="-160" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="160" y1="0" x2="190" y2="0" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="-190" x2="0" y2="-160" stroke="#38bdf8" stroke-width="2" />
    <line x1="0" y1="160" x2="0" y2="190" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Data Stream Micro Code / Binary Decorative Blocks -->
  <g fill="#06b6d4" opacity="0.4" font-family="monospace" font-size="10">
    <text x="80" y="100">SYS_LOC // 0x8849F</text>
    <text x="80" y="115">STATUS // CONNECTED</text>
    <text x="80" y="130">NET_CYAN // 100Gbps</text>

    <text x="1720" y="960">BANDWIDTH // OPTIMAL</text>
    <text x="1720" y="975">LATENCY // 0.12ms</text>
    <text x="1720" y="990">NODE_ID // #7702-AZ</text>
  </g>

  <!-- Framing Tech Accents (Corners) -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top Left -->
    <path d="M 50 80 L 50 50 L 80 50" />
    <!-- Bottom Right -->
    <path d="M 1870 1000 L 1870 1030 L 1840 1030" />
  </g>
</svg>
