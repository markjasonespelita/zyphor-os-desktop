<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dark Background Radial Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#072540" />
      <stop offset="45%" stop-color="#091322" />
      <stop offset="85%" stop-color="#030712" />
      <stop offset="100%" stop-color="#010308" />
    </radialGradient>

    <!-- Cyan Electric Gradients -->
    <linearGradient id="cyan-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="cyan-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="shard-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.01" />
    </linearGradient>

    <!-- Tech Patterns -->
    <pattern id="dot-matrix" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#38bdf8" opacity="0.15" />
    </pattern>

    <pattern id="circuit-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 0 60 L 40 60 L 60 40 L 120 40" fill="none" stroke="#0891b2" stroke-width="0.75" opacity="0.2" />
      <path d="M 60 120 L 60 80 L 80 60 L 80 0" fill="none" stroke="#0891b2" stroke-width="0.75" opacity="0.2" />
      <circle cx="40" cy="60" r="2" fill="#0ea5e9" opacity="0.3" />
      <circle cx="80" cy="60" r="2" fill="#0ea5e9" opacity="0.3" />
    </pattern>

    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
  </defs>

  <!-- Deep Base Canvas -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="300" r="450" fill="#0284c7" opacity="0.18" filter="url(#ambient-blur)" />
  <circle cx="1500" cy="700" r="500" fill="#06b6d4" opacity="0.15" filter="url(#ambient-blur)" />

  <!-- Grid Overlays -->
  <rect width="100%" height="100%" fill="url(#dot-matrix)" />
  <rect width="100%" height="100%" fill="url(#circuit-grid)" />

  <!-- Abstract Tech Geometry / Glass Shards -->
  <g opacity="0.8">
    <polygon points="200,-100 650,-100 450,550 0,550" fill="url(#shard-fill)" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    <polygon points="750,150 1350,150 1050,850 450,850" fill="url(#shard-fill)" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1" />
    <polygon points="1200,400 1850,400 1550,1150 900,1150" fill="url(#shard-fill)" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1" />
  </g>

  <!-- High-Speed Data Beams -->
  <g filter="url(#neon-glow)">
    <path d="M -100 250 L 800 250 L 1050 500 L 2050 500" fill="none" stroke="url(#cyan-beam)" stroke-width="2.5" />
    <path d="M -100 750 L 550 750 L 800 500 L 2050 500" fill="none" stroke="url(#cyan-beam)" stroke-width="1.5" opacity="0.7" />
    <path d="M -100 400 L 1200 400 L 1450 650 L 2050 650" fill="none" stroke="url(#cyan-beam)" stroke-width="3" />
    <path d="M -100 900 L 950 900 L 1150 700 L 2050 700" fill="none" stroke="url(#cyan-beam)" stroke-width="1" opacity="0.5" />
  </g>

  <!-- Glowing Nodes along Data Pathways -->
  <g fill="#22d3ee" filter="url(#neon-glow)">
    <circle cx="800" cy="250" r="4" />
    <circle cx="1050" cy="500" r="5" fill="#ffffff" />
    <circle cx="550" cy="750" r="4" />
    <circle cx="1200" cy="400" r="4" />
    <circle cx="1450" cy="650" r="6" fill="#ffffff" />
    <circle cx="950" cy="900" r="3" />
  </g>

  <!-- Floating HUD / Cyber Matrix Center Core -->
  <g transform="translate(1050, 500)">
    <!-- Concentric Tech Circles -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="#0891b2" stroke-width="1" stroke-dasharray="10 15 4 15" opacity="0.4" />
    <circle cx="0" cy="0" r="240" fill="none" stroke="url(#cyan-primary)" stroke-width="2" stroke-dasharray="140 30 40 30" opacity="0.8" filter="url(#neon-glow)" />
    <circle cx="0" cy="0" r="190" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="6 6" opacity="0.5" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="#0284c7" stroke-width="1.5" />
    
    <!-- Central Core -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#neon-glow)" />
    <circle cx="0" cy="0" r="40" fill="url(#cyan-primary)" opacity="0.2" filter="url(#ambient-blur)" />

    <!-- Crosshair Target Marks -->
    <path d="M -160 0 L -130 0 M 130 0 L 160 0 M 0 -160 L 0 -130 M 0 130 L 0 160" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Decorative Telemetry / Data Overlay -->
  <g fill="#06b6d4" opacity="0.5" font-family="monospace" font-size="11">
    <text x="100" y="80">&gt; SYSTEM_READY // 0x99F4</text>
    <text x="100" y="100">&gt; NETWORK_CYAN // ACTIVE</text>
    <text x="100" y="120">&gt; ENCRYPTION // TLS_1.3</text>

    <text x="1680" y="980">NODES // 1024</text>
    <text x="1680" y="1000">LATENCY // 0.04ms</text>
    <text x="1680" y="1020">BUFFER // 100%</text>
  </g>

  <!-- Corner Framing Accents -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 60 90 L 60 60 L 90 60" />
    <path d="M 1860 990 L 1860 1020 L 1830 1020" />
  </g>
</svg>
