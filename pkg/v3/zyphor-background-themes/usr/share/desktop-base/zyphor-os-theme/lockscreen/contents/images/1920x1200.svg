<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="60%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#0b1329" />
      <stop offset="85%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Cyan Electric Gradients -->
    <linearGradient id="cyan-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="30%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="cyan-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glass-shard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.01" />
    </linearGradient>

    <!-- Tech Patterns -->
    <pattern id="dot-matrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#38bdf8" opacity="0.18" />
    </pattern>

    <pattern id="hex-mesh" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 0 57.735 L 0 80.829 L 20 92.376 L 40 80.829 L 40 57.735 L 20 46.188 Z" 
            fill="none" stroke="#0891b2" stroke-width="0.6" stroke-opacity="0.12" />
    </pattern>

    <!-- High-Tech Filter Glows -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="100" />
    </filter>
  </defs>

  <!-- Base Space/Canvas Layer -->
  <rect width="100%" height="100%" fill="url(#bg-glow)" />

  <!-- Ambient Light Orbs -->
  <circle cx="1200" cy="350" r="450" fill="#0284c7" opacity="0.2" filter="url(#ambient-blur)" />
  <circle cx="400" cy="750" r="500" fill="#0891b2" opacity="0.15" filter="url(#ambient-blur)" />

  <!-- Micro Dot Matrix & Hex Mesh Overlays -->
  <rect width="100%" height="100%" fill="url(#dot-matrix)" />
  <rect width="100%" height="100%" fill="url(#hex-mesh)" />

  <!-- Modern Geometric Panels / Glass Shards -->
  <g opacity="0.75">
    <polygon points="1100,-100 1600,-100 1300,600 800,600" fill="url(#glass-shard)" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    <polygon points="850,200 1450,200 1150,900 550,900" fill="url(#glass-shard)" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1" />
    <polygon points="300,500 850,500 600,1100 50,1100" fill="url(#glass-shard)" stroke="#22d3ee" stroke-opacity="0.12" stroke-width="1" />
  </g>

  <!-- Cybernetic Circuit Traces & Data Highway Beams -->
  <g filter="url(#neon-glow)">
    <path d="M -100 280 L 750 280 L 1000 530 L 2050 530" fill="none" stroke="url(#cyan-beam)" stroke-width="2.5" />
    <path d="M -100 320 L 730 320 L 980 570 L 2050 570" fill="none" stroke="url(#cyan-beam)" stroke-width="1" opacity="0.6" />
    <path d="M -100 800 L 500 800 L 750 550 L 2050 550" fill="none" stroke="url(#cyan-beam)" stroke-width="2" />
    <path d="M -100 180 L 1150 180 L 1400 430 L 2050 430" fill="none" stroke="url(#cyan-beam)" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Glowing Data Nodes along Pathways -->
  <g fill="#22d3ee" filter="url(#neon-glow)">
    <circle cx="750" cy="280" r="4" />
    <circle cx="1000" cy="530" r="5" fill="#ffffff" />
    <circle cx="500" cy="800" r="4" />
    <circle cx="750" cy="550" r="5" fill="#ffffff" />
    <circle cx="1150" cy="180" r="4" />
    <circle cx="1400" cy="430" r="4" />
  </g>

  <!-- Modern Central Neural / Core Technology HUD -->
  <g transform="translate(1100, 480)">
    <!-- Concentric Tech Rings -->
    <circle cx="0" cy="0" r="300" fill="none" stroke="#0891b2" stroke-width="1" stroke-dasharray="8 14 4 14" opacity="0.4" />
    <circle cx="0" cy="0" r="260" fill="none" stroke="url(#cyan-primary)" stroke-width="2" stroke-dasharray="160 30 40 30" opacity="0.8" filter="url(#neon-glow)" />
    <circle cx="0" cy="0" r="200" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="6 6" opacity="0.5" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#0284c7" stroke-width="1.5" />

    <!-- Hexagonal Core Interface -->
    <polygon points="0,-90 77.94,-45 77.94,45 0,90 -77.94,45 -77.94,-45" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" filter="url(#neon-glow)" />
    <polygon points="0,-60 51.96,-30 51.96,30 0,60 -51.96,30 -51.96,-30" fill="url(#cyan-primary)" opacity="0.15" />
    
    <!-- Central Node -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" filter="url(#neon-glow)" />

    <!-- Target Alignment Ticks -->
    <path d="M -180 0 L -150 0 M 150 0 L 180 0 M 0 -180 L 0 -150 M 0 150 L 0 180" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Modern Sci-Fi Data Overlay / Telemetry -->
  <g fill="#06b6d4" opacity="0.5" font-family="monospace" font-size="11">
    <text x="80" y="80">&gt; NEURAL_LINK // ACTIVE</text>
    <text x="80" y="100">&gt; QUANTUM_CORE // ONLINE</text>
    <text x="80" y="120">&gt; DATA_STREAM // 1.2 TB/s</text>

    <text x="1700" y="980">SYS_VER // 4.0.1</text>
    <text x="1700" y="1000">LATENCY // 0.01ms</text>
    <text x="1700" y="1020">BUFFER // OPTIMAL</text>
  </g>

  <!-- Tech Frame Corner Accents -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 50 80 L 50 50 L 80 50" />
    <path d="M 1870 1000 L 1870 1030 L 1840 1030" />
  </g>
</svg>
