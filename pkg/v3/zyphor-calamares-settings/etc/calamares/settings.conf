# Configuration file for Calamares
# Zyphor OS 3 "Bethany" LTS
# Syntax is YAML 1.2
---

modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

quit-at-end: false


sequence:

# Phase 1 - prepare.
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary


# Phase 2 - install.
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs

  # Zyphor-specific final installation configuration
  - shellprocess@zyphor-finish-install

  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount


# Phase 3 - postinstall.
- show:
  - finished


# Zyphor OS branding
branding: zyphor


prompt-install: false

# Normal operating-system installation:
# Calamares operates inside the installed target using chroot.
dont-chroot: false